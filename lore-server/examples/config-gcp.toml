# Lore Server Configuration Example: GCP Storage
# =====================================================================
# This configuration demonstrates using GCP services (GCS + Firestore)
# for storage, suitable for production cloud deployments.
#
# Required GCP resources:
# - GCS bucket for immutable fragment payloads (with object versioning
#   enabled, so obliterate can remove every generation of an object)
# - Firestore database (native mode) for fragment lifecycle state,
#   fragment reference associations, the mutable store and the lock store
# - The composite indexes documented in lore-gcp/firestore.indexes.json
#
# Credentials: both GCS and Firestore use Application Default Credentials
# (`gcloud auth application-default login`, a service account key via
# GOOGLE_APPLICATION_CREDENTIALS, or workload identity) -- there is no
# credential setting in this file.
#
# GCP-specific settings are in the [plugins.gcp] section.

[immutable_store]
mode = "gcp"

[mutable_store]
mode = "gcp"

# Locks live in Firestore, so every server sharing the collection sees the same
# locks. "local" keeps them in one server's memory instead.
[lock_store]
mode = "gcp"

# Publishes branch and lock events to Pub/Sub as the encoded
# lore.notification.Event protobuf, the same message the in-process sender
# broadcasts. Each message carries event_type, repository and, where the event
# names one, branch as attributes, so a subscription can filter without
# decoding the payload. Omit this section to keep the default in-process
# sender.
#
# The topic must exist; the plugin does not create it. The service account needs
# roles/pubsub.publisher on it.
#
# Neither is enforced at startup. The plugin looks the topic up and logs what it
# finds, but roles/pubsub.publisher grants pubsub.topics.publish and not
# pubsub.topics.get, so the correctly scoped identity cannot read the topic's
# metadata and the lookup is inconclusive for it. Refusing to start on that
# would reject the very deployment this file describes. A wrong topic name
# therefore still yields a server that runs normally and discards every event --
# check the name and the grant yourself, and grep the startup log for the
# topic.
#
# Events go to both: the server keeps delivering to the in-process sender, so
# the gRPC Subscribe RPC works alongside the topic rather than being replaced
# by it.
#
# Several server instances: set pubsub_receive = true, and each instance also
# delivers the events every other instance publishes to its own Subscribe
# clients. Each message carries an origin attribute naming the instance that
# published it, so an instance skips its own. Each instance reads through a
# subscription of its own: by default it creates
# {pubsub_subscription_prefix}-{origin} at startup, with an expiration policy
# and a short message retention, and deletes it at shutdown. That needs
# pubsub.topics.attachSubscription on the topic (in roles/pubsub.subscriber)
# and pubsub.subscriptions.create, .consume and .delete in pubsub_project
# (roles/pubsub.editor, or a custom role). Failing to delete is
# logged and ignored; the expiration policy removes the subscription once it
# has gone unused for pubsub_subscription_ttl_seconds. Alternatively, set
# pubsub_subscription to a subscription created for this instance alone:
# Pub/Sub hands each message to one reader of a subscription, so instances
# sharing one would each miss the others' events.
#
# What this does not cover: obliterate propagation between server instances.
#[notification]
#mode = "gcp"
#
# The Pub/Sub settings go in [plugins.gcp] directly, not a notification
# sub-table: configure_notification passes the whole [plugins.gcp] table to the
# plugin unchanged, where the stores resolve a sub-table per store.
#
#   [plugins.gcp]
#   firestore_project = "..."
#   pubsub_project = "my-project"
#   pubsub_topic = "lore-events"
#   pubsub_receive = false                       # default
#   pubsub_subscription = "lore-events-a"        # default unset: one is created
#   pubsub_subscription_prefix = "lore-server"   # default
#   pubsub_subscription_ttl_seconds = 86400      # default; Pub/Sub's minimum
#   pubsub_message_retention_seconds = 600       # default; Pub/Sub's minimum

# ---------------------------------------------------------------------
# GCP Plugin Configuration
# ---------------------------------------------------------------------
# Firestore project/database are shared by the stores below and are
# inherited by [plugins.gcp.immutable_store], [plugins.gcp.mutable_store] and
# [plugins.gcp.lock_store] unless overridden there (the same [plugins.aws.http]-style inheritance
# config-aws.toml relies on for settings shared across its stores).
[plugins.gcp]
firestore_project = "my-gcp-project"
# firestore_database = "my-named-database"  # optional; defaults to "(default)"

# Immutable store settings (GCS + Firestore)
[plugins.gcp.immutable_store]
gcs_bucket = "lore-fragments"
# gcs_project = "my-gcp-project"          # reserved; not required today, see lore-gcp docs
# gcs_endpoint_url = "http://localhost:9000"  # for a GCS-compatible test double
gcs_slow_operation_threshold_millis = 5000
firestore_slow_operation_threshold_millis = 2000
timeout_millis = 30000

firestore_fragment_state_collection = "fragment_state"
firestore_fragment_associations_collection = "fragment_associations"

# Force write mode for debugging/profiling purposes, always overwrites data already present
# force_write = false

# Mutable store settings (Firestore)
[plugins.gcp.mutable_store]
firestore_mutable_store_collection = "mutable_store"
slow_operation_threshold_millis = 2000
timeout_millis = 15000

# Lock store settings (Firestore)
[plugins.gcp.lock_store]
firestore_lock_store_collection = "locks"
slow_operation_threshold_millis = 2000
timeout_millis = 30000
