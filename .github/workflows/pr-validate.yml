# Runs the test suite on GitHub-hosted runners. This workflow needs no secrets:
# it checks the source out from git and starts the integration test services
# from public container images.
name: PR Validate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # Runs `cargo test` for the workspace. A cargo feature gates the integration
  # tests, so they do not run here.
  unit:
    name: unit (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # Check out the PR head to test it
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          # TODO: re-enable. `cargo test --workspace` links every test binary
          # with embedded DWARF, because .cargo/config.toml sets
          # split-debuginfo=off for aarch64-unknown-linux-gnu. The linker
          # exhausts the 16 GB arm64 runner, which kills the job before any test
          # runs. Setting split-debuginfo=packed for that target, or building the
          # tests with line tables only, lowers the linker's peak memory.
          # - { name: linux-aarch64, os: ubuntu-24.04-arm }
          # TODO: re-enable. Only linux-x86_64 runs while this workflow is still
          # being changed.
          # - { name: macos-aarch64, os: macos-latest }
          # - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # `cargo test --workspace` builds a debug test binary for every crate with
      # embedded DWARF, which does not fit on the runner's root filesystem. The
      # Linux runners carry a larger volume at /mnt, so build there. This step
      # runs before rust-cache so the cache uses this target directory. The
      # macOS and Windows runners have no /mnt and build in the workspace.
      - name: Build on the larger /mnt volume
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /mnt/cargo-target
          sudo chown -R "$(id -u):$(id -g)" /mnt/cargo-target
          echo "CARGO_TARGET_DIR=/mnt/cargo-target" >> "$GITHUB_ENV"
          df -h / /mnt

      - uses: Swatinem/rust-cache@v2
        with:
          key: unit-${{ matrix.name }}

      - name: cargo test
        run: cargo test --workspace --verbose

  # Runs the integration tests against the MinIO, DynamoDB Local, and Consul
  # services that Docker Compose starts. Only the Linux runners provide Docker.
  # The tests connect to 127.0.0.1 on ports 9000, 9090, and 8500, which the
  # compose file maps.
  integration:
    name: integration (linux-x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the PR head to test it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # Build on /mnt. See the unit job for the reason.
      - name: Build on the larger /mnt volume
        run: |
          sudo mkdir -p /mnt/cargo-target
          sudo chown -R "$(id -u):$(id -g)" /mnt/cargo-target
          echo "CARGO_TARGET_DIR=/mnt/cargo-target" >> "$GITHUB_ENV"
          df -h / /mnt

      - uses: Swatinem/rust-cache@v2
        with:
          key: integration

      - name: Start backing services (MinIO, DynamoDB Local, Consul)
        run: >
          docker compose --file lore-integration-tests/compose.yaml up --detach
          minio dynamodb consul-server consul-node-1

      - name: Wait for services to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/ready \
               && curl -sf http://127.0.0.1:8500/v1/status/leader \
               && curl -s -o /dev/null http://127.0.0.1:9090; then
              echo "services ready"
              exit 0
            fi
            echo "waiting for services (attempt $i)..."
            sleep 2
          done
          echo "services did not become ready in time"
          exit 1

      - name: cargo test (integration)
        env:
          AWS_ACCESS_KEY_ID: lorelocal
          AWS_SECRET_ACCESS_KEY: lorelocal
          AWS_REGION: us-east-1
        run: >
          cargo test --package lore-integration-tests
          --features integration_tests --verbose

      - name: Dump service logs on failure
        if: failure()
        run: docker compose --file lore-integration-tests/compose.yaml logs

      - name: Stop services
        if: always()
        run: docker compose --file lore-integration-tests/compose.yaml down --volumes

  # Runs lore-gcp's integration tests (gcp_store_test.rs) against the Firestore emulator and the
  # Google Cloud Storage testbench. Deliberately excluded from pr-validate's `needs:` below, so a
  # failure here does not block a PR — see the comment on that job for why.
  #
  # Unlike the AWS integration job, this one also needs credentials, because neither client
  # library treats an emulator/test-double endpoint as a reason to skip Application Default
  # Credential resolution. Real credentials are not an option in a public-CI PR-validation
  # workflow that runs with no secrets (see this file's header comment), so instead this job runs
  # a fake GCE metadata server (gcp_fake_metadata_server.py) that both `firestore`/`gcloud-sdk`
  # and `google-cloud-storage`/`google-cloud-auth` fall back to when no other credential source is
  # configured, exactly as they would on a real GCE/GKE/Cloud Run instance. Neither the emulator
  # nor the testbench verifies the resulting token's signature. See that script's module doc for
  # why this is the only credential path that works here without either a live Google account or
  # the aws-lc-rs backend this workspace's deny.toml forbids (which is what firestore's own
  # service-account-key credential path would otherwise need, on the gcloud-sdk version pinned to
  # stay deny.toml-compliant).
  #
  # Known-failing today: the mutable-store tests (Firestore only) pass; the immutable-store tests
  # (which write to GCS) do not, because of a confirmed bug in the GCS testbench itself, not in
  # lore-gcp — see `lore_gcp::store::immutable_store`'s module docs ("A test-double bug, not a
  # `lore-gcp` bug") for the full, hand-verified root cause. This job still runs on every PR
  # (rather than being removed) because the Firestore side is real, valuable coverage on its own,
  # and because a future testbench release or `google-cloud-storage` fix could make the rest of it
  # pass with no changes needed here.
  gcp-integration:
    name: gcp-integration (linux-x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the PR head to test it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # Build on /mnt. See the unit job for the reason.
      - name: Build on the larger /mnt volume
        run: |
          sudo mkdir -p /mnt/cargo-target
          sudo chown -R "$(id -u):$(id -g)" /mnt/cargo-target
          echo "CARGO_TARGET_DIR=/mnt/cargo-target" >> "$GITHUB_ENV"
          df -h / /mnt

      - uses: Swatinem/rust-cache@v2
        with:
          key: gcp-integration

      # Both gcloud-sdk and google-cloud-auth query their configured metadata host on port 80
      # unconditionally, and default that host to metadata.google.internal. Routing that name to
      # gcp-fake-metadata's published port 80 here means the test step below needs no
      # GCE_METADATA_HOST override, matching how a real GCE instance needs none either.
      - name: Route metadata.google.internal to the fake metadata server
        run: echo "127.0.0.1 metadata.google.internal" | sudo tee -a /etc/hosts

      - name: Start backing services (Firestore emulator, GCS testbench, fake metadata server)
        run: >
          docker compose --file lore-integration-tests/compose.yaml up --detach
          firestore-emulator gcs-testbench gcp-fake-metadata

      - name: Wait for services to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8080 \
               && curl -sf -o /dev/null http://127.0.0.1:9010 \
               && curl -sf -o /dev/null http://metadata.google.internal/; then
              echo "services ready"
              exit 0
            fi
            echo "waiting for services (attempt $i)..."
            sleep 2
          done
          echo "services did not become ready in time"
          exit 1

      # The testbench serves its gRPC control-plane surface (bucket/object metadata operations)
      # only once asked to; its JSON/HTTP data-plane surface (object upload/download) is up from
      # the start. See the gcs-testbench service's comment in compose.yaml.
      - name: Start the GCS testbench's gRPC control-plane server
        run: curl -sf "http://127.0.0.1:9010/start_grpc?port=8888"

      - name: Create the GCS testbench bucket lore-gcp's tests write to
        run: >
          curl -sf -X POST -H 'Content-Type: application/json'
          -d '{"name":"lore-gcp-ci-bucket"}'
          'http://127.0.0.1:9010/storage/v1/b?project=lore-gcp-test'

      - name: cargo test (gcp-integration)
        env:
          # Deliberately no GOOGLE_APPLICATION_CREDENTIALS: see this job's header comment.
          LORE_GCP_TEST_PROJECT: lore-gcp-test
          LORE_GCP_TEST_BUCKET: lore-gcp-ci-bucket
          LORE_GCP_TEST_GCS_ENDPOINT: http://127.0.0.1:9010
          LORE_GCP_TEST_GCS_CONTROL_ENDPOINT: http://127.0.0.1:8888
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: >
          cargo test --package lore-integration-tests --test integration
          --features integration_tests --verbose gcp_store_tests

      - name: Dump service logs on failure
        if: failure()
        run: docker compose --file lore-integration-tests/compose.yaml logs

      - name: Stop services
        if: always()
        run: docker compose --file lore-integration-tests/compose.yaml down --volumes

  # Runs the tests in scripts/test that carry the `smoke` marker, through uv,
  # against release binaries built here. The server build enables
  # failure_generator so the fault injection tests run instead of skipping.
  smoke:
    name: smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # Check out the PR head to test it
    strategy:
      fail-fast: false
      matrix:
        include:
          # basetemp-arg puts the pytest working data on the tmpfs that the
          # "Grow /dev/shm" step below resizes.
          - { name: linux-x86_64, os: ubuntu-latest, basetemp-arg: "--basetemp=/dev/shm/lore-smoke" }
          # TODO: re-enable. Only linux-x86_64 runs while this workflow is still
          # being changed.
          # - { name: linux-aarch64, os: ubuntu-24.04-arm, basetemp-arg: "--basetemp=/dev/shm/lore-smoke" }
          # - { name: macos-aarch64, os: macos-latest }
          # Windows needs explicit loopback ports for the local remote server.
          # - name: windows-x86_64
          #   os: windows-latest
          #   extra-args: >-
          #     --lore-remote-http-port 41339
          #     --lore-remote-quic-port 41338
          #     --lore-remote-grpc-port 41338
          #     --lore-remote-internal-port 41340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # Build on /mnt. See the unit job for the reason. conftest resolves the
      # `release` binary keyword to <cwd>/target/release, which stays empty when
      # CARGO_TARGET_DIR points elsewhere, so name the binaries directly.
      # LORE_EXECUTABLE_PATH and LORE_SERVER_EXECUTABLE_PATH take precedence
      # over the --lore-*-binary flags below.
      - name: Build on the larger /mnt volume
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /mnt/cargo-target
          sudo chown -R "$(id -u):$(id -g)" /mnt/cargo-target
          {
            echo "CARGO_TARGET_DIR=/mnt/cargo-target"
            echo "LORE_EXECUTABLE_PATH=/mnt/cargo-target/release/lore"
            echo "LORE_SERVER_EXECUTABLE_PATH=/mnt/cargo-target/release/loreserver"
          } >> "$GITHUB_ENV"
          df -h / /mnt

      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-${{ matrix.name }}

      - uses: astral-sh/setup-uv@v5

      - name: Build lore and loreserver (release)
        run: >
          cargo build --release
          --package lore-client --package lore-server
          --features lore-server/failure_generator
          --bin lore --bin loreserver

      # The suite writes about 10 GB of server stores and per-test repositories,
      # and pytest keeps all of it for the session. Holding that on tmpfs instead
      # of the runner disk speeds up these I/O-bound tests. /dev/shm defaults to
      # 8 GB, which the suite exceeds, so raise it to 12 GB. The runners have
      # 16 GB of RAM, and tmpfs only uses RAM for the data written to it.
      - name: Grow /dev/shm for smoke test data (tmpfs)
        if: runner.os == 'Linux'
        run: sudo mount -o remount,size=12G /dev/shm

      # `uv run` installs the test dependencies from uv.lock.
      - name: Smoke tests
        run: >
          uv run pytest scripts/test -m smoke -n 4
          --lore-client-binary release
          --lore-server-binary release
          ${{ matrix.basetemp-arg }}

  # Reports one result for the jobs above so branch protection can require a
  # single check.
  #
  # gcp-integration is deliberately not in needs: below, for two independent reasons: (1) its
  # immutable-store tests currently fail against a confirmed bug in the GCS testbench itself, not
  # in lore-gcp (see that job's own comment), so requiring it would block every PR on a third
  # party's bug with no lore-gcp-side fix available; (2) even its passing half depends on a
  # credential path (a fake GCE metadata server) that is new and has not yet had a run on a real
  # PR, so a GH-Actions-specific surprise there (sudo/etc-hosts or port-80 publishing behaving
  # differently than expected) should not be able to block every PR from the first run either.
  # Revisit once the testbench (or google-cloud-storage) fixes the bug and the credential path has
  # proven reliable in practice.
  pr-validate:
    name: PR Validate
    if: ${{ always() }}
    needs: [unit, integration, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all validation jobs passed
        run: |
          echo "unit=${{ needs.unit.result }}"
          echo "integration=${{ needs.integration.result }}"
          echo "smoke=${{ needs.smoke.result }}"
          if [ "${{ needs.unit.result }}" != "success" ] \
             || [ "${{ needs.integration.result }}" != "success" ] \
             || [ "${{ needs.smoke.result }}" != "success" ]; then
            echo "One or more validation jobs failed."
            exit 1
          fi
          echo "All validation jobs passed."
